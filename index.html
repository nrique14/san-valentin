<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>San Valentín 💌</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Poppins:wght@300;400&display=swap" rel="stylesheet">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:'Poppins',sans-serif;
    min-height:100vh;
    overflow-x:hidden;
    background:linear-gradient(135deg,#ff9a9e 0%,#fad0c4 50%,#fad0c4 100%);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:20px;
}

/* CONTENEDOR PRINCIPAL */
#contenido{
    width:100%;
    max-width:600px;
    background:rgba(255,255,255,0.85);
    backdrop-filter:blur(10px);
    padding:25px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.15);
    margin-top:20px;
    position:relative;
    z-index:10;
}
#contenido h1{
    position:relative;
    z-index:20;
}

#contenido h2{
    position:relative;
    z-index:50;
}

/* TITULOS */
h1,h2,h3{
    font-family:'Playfair Display',serif;
    margin-bottom:15px;
    color:#b30059;
}

/* BOTONES */
button{
    background:#ff4d88;
    color:white;
    border:none;
    padding:10px 18px;
    border-radius:25px;
    cursor:pointer;
    transition:0.3s;
    margin-top:10px;
}
button:hover{
    background:#e6005c;
    transform:scale(1.05);
}

/* INPUTS */
input,select,textarea{
    width:100%;
    padding:8px;
    margin-top:8px;
    border-radius:12px;
    border:1px solid #ddd;
}

/* CAJAS */
.caja{
    background:white;
    padding:15px;
    border-radius:15px;
    margin-bottom:15px;
    box-shadow:0 5px 15px rgba(0,0,0,0.05);
}


/* CORAZONES */
.heart{
    position:fixed;
    width:20px;
    height:20px;
    background:red;
    transform:rotate(45deg);
    animation:fall linear forwards;
    z-index:0;
}
.heart:before,
.heart:after{
    content:"";
    position:absolute;
    width:20px;
    height:20px;
    background:red;
    border-radius:50%;
}
.heart:before{top:-10px;left:0;}
.heart:after{left:-10px;top:0;}

@keyframes fall{
    from{
        transform:translateY(-50px);
    }
    to{
        transform:translateY(110vh);
        opacity:0;
    }
}

/* RESPONSIVE */
@media(max-width:600px){
    #contenido{
        padding:15px;
    }
}
</style>
</head>
<meta charset="UTF-8">
<title>San Valentín 💌</title>
<body>

<h1>💌 Pequeño juego de San Valentín</h1>
<div id="contenido"></div>

<script>

// ================= CONFIG =================
// let modoPrueba=true;
//let diaSimulado=2; // cambia 1 o 2

const digitosCorrectos=["0","9","1","2"]; // 4 dígitos ahora

// =============== SISTEMA DÍAS ============

// =============== STORAGE ==================
function guardarDigito(d){
 let arr=JSON.parse(localStorage.getItem("digitos"))||[];
 arr.push(d);
 localStorage.setItem("digitos",JSON.stringify(arr));
}

// =============== DÍA 1 ====================
function dia1(){

let canciones = [

},

},

},

},

opcionesCancion:["Amor secreto","Te necesito","Loco por volverte a ver","Millonario de amor"],
opcionesArtista:["Grupo 5","Chili Fernández","Los Ángeles Azules","Américo"]
},
{
correcta:["Nada es eterno","J Alvarez"],
opcionesCancion:["La pregunta","Nada es eterno","Déjate llevar","Junto al amanecer"],
opcionesArtista:["Arcángel","Ñengo Flow","J Alvarez","Farruko"]
},
{
correcta:["Si no te tengo","Nigga"],
opcionesCancion:["Te amo tanto","Si no te tengo","Baby te quiero","Quisiera amarte"],

},
{

opcionesArtista:["Maná","Zoé","Café Tacvba","Caifanes"]
},
{
correcta:["Ojalá pudiera","Maná"],

},
{

opcionesCancion:["Botella tras botella","Adiós amor","Ya no somos ni seremos","Probablemente"],
opcionesArtista:["Gerardo Ortiz","Christian Nodal","Carin León","Julión Álvarez"]
}
];

// Mezclar SIN tocar el blanco
function mezclar(array){
return array.sort(()=>Math.random()-0.5);
}

for(let i=0;i<canciones.length;i++){

let opcionesC = ["", ...mezclar([...canciones[i].opcionesCancion])];
let opcionesA = ["", ...mezclar([...canciones[i].opcionesArtista])];

html+=`
<div class="caja">
<h3>Canción ${i+1}</h3>

<audio controls src="audio${i+1}.mp3"></audio><br>

<label>Nombre de la canción:</label>
<select id="c${i+1}">
${opcionesC.map(op=>`<option value="${op}">${op}</option>`).join("")}
</select>

<label>Artista / Grupo:</label>
<select id="a${i+1}">
${opcionesA.map(op=>`<option value="${op}">${op}</option>`).join("")}
</select>

</div>`;
}

html+=`<button onclick="validarDia1()">Validar</button>`;
contenido.innerHTML=html;

window.respuestasDia1 = canciones.map(c=>c.correcta);
}



function validarDia1(){

let errores=[];
let aciertos=0;

for(let i=1;i<=10;i++){

let cancion=document.getElementById("c"+i).value.trim();
let artista=document.getElementById("a"+i).value.trim();

let correctaCancion=window.respuestasDia1[i-1][0];
let correctaArtista=window.respuestasDia1[i-1][1];

if(cancion===correctaCancion && artista===correctaArtista){
aciertos++;
}else{
errores.push("Canción "+i);
}
}

if(aciertos===10){
alert("🎵 Día 1 superado 💖\nTus códigos son: 0 y 9");
guardarDigito("0");
guardarDigito("9");
dia2();
}else{
alert("Fallaste en: " + errores.join(", "));
}
}



// =============== DÍA 2 ====================
function dia2(){

let html=`<h2>💭 Día 2: ¿Cuánto me conoces?</h2>`;

let preguntas = [
{
    pregunta: "¿Cuál es mi plato favorito?",
    correcta:"Tallarines Rojos con huancaina",
    opciones:["Tallarines Rojos con huancaina","Arroz con pollo","Lomo saltado","Ají de gallina"]
},
{
    pregunta: "¿Cuál es mi color favorito?",
    correcta:"Negro",
    opciones:["Negro","Azul","Blanco","Morado"]
},
{
    pregunta: "¿Cuál es mi deporte favorito?",
    correcta:"Voley",
    opciones:["Fútbol","Basket","Voley","Natación"]
},
{
    pregunta: "¿Cuál es mi estación del año preferida?",
    correcta:"Invierno",

},
{
    pregunta: "¿Qué bebida me gusta más?",
    correcta:"Guaraná",
    opciones:["Coca Cola","Inca Kola","Guaraná","Crush"]
},
{
    pregunta: "¿Cuál es la primera canción que te he dedicado?",
    correcta:"Perfectly perfect",
    opciones:["Perfectly perfect","Perfect","Oficial","Eres"]
},
{
    pregunta: "¿Cuál es mi película favorita?",
    correcta:"Saw",
    opciones:["Saw","El Conjuro","It","Jhon Wick"]
},
{
    pregunta: "¿Qué anime me gusta más?",
    correcta:"Code Geass",
    opciones:["Naruto","Death Note","Code Geass","One piece"]
},
{
    pregunta: "¿Qué serie me encanta?",
    correcta:"Breaking bad",
    opciones:["Breaking bad","The walking death","Suits","Stranger Things"]
},
{
    pregunta: "¿Cuál es mi cantante favorit@?",
    correcta:"Chester Bennington",
    opciones:["Chester Bennington","Sebastian Yatra","Emily Armstrong","Marilyn mason"]
}
];


// Función para mezclar
function mezclar(array){
return array.sort(()=>Math.random()-0.5);
}

for(let i=0;i<preguntas.length;i++){
    let opciones = ["", ...mezclar([...preguntas[i].opciones])];

    html+=`
    <div class="caja">
        <p>${i+1}. ${preguntas[i].pregunta}</p>
        <select id="p${i+1}">
            ${opciones.map(op=>`<option value="${op}">${op}</option>`).join("")}
        </select>
    </div>
    `;
}


html+=`<button onclick="validarDia2()">Validar</button>`;
contenido.innerHTML=html;

// Guardamos respuestas correctas globalmente
window.respuestasDia2 = preguntas.map(p=>p.correcta);
}


function validarDia2(){

let errores=[];
let puntos=0;

for(let i=1;i<=10;i++){

let valor=document.getElementById("p"+i).value.trim();
let correcta=window.respuestasDia2[i-1];

if(valor===correcta){
puntos++;
}else{
errores.push("Pregunta "+i);
}
}

if(puntos===10){
alert("💭 Día 2 completado 💖\nTus códigos son: 1 y 2");
guardarDigito("1");
guardarDigito("2");
mostrarFinal();
}else{
alert("Fallaste en: " + errores.join(", "));
}
}


// =============== FINAL =====================
function mostrarFinal(){
contenido.innerHTML=`
<h2>🔐 Ingresa la contraseña</h2>
<input id="clave"><button onclick="verificarClave()">Abrir</button>
`;
}

function verificarClave(){
let ingresada=clave.value;
let correcta=digitosCorrectos.join("");
if(ingresada===correcta){
mostrarExperiencia();
}else alert("Clave incorrecta");
}

// =============== EXPERIENCIA ROMÁNTICA =================
function mostrarExperiencia(){

// corazones
setInterval(()=>{
 let heart=document.createElement("div");
 heart.className="heart";
 heart.innerHTML="❤️";
 heart.style.left=Math.random()*100+"vw";
 heart.style.animationDuration=(Math.random()*3+2)+"s";
 document.body.appendChild(heart);
 setTimeout(()=>heart.remove(),5000);
 iniciarCorazones();
},500);

contenido.innerHTML=`
<h1 style="
font-size:32px;
text-align:center;
margin-bottom:25px;
color:#b30059;
position:relative;
z-index:20;
">
💌 Tengo algo muy importante que decirte...
</h1>

<div class="caja" style="font-size:18px; line-height:1.6; text-align:left;">

<p>Desde que llegaste a mi vida, iluminaste cada esquina de mi vida que antes creía oscura.  
Estos meses que hemos compartido han sido tan bonitos, llenos de momentos que nunca olvidaré.</p>

<p>Gracias por ser simplemente como eres. A veces dices cosas que te hacen dudar de ti misma,  
y eso me frustra porque quiero que veas lo que yo veo con mis ojitos, quiero que te des cuenta lo maravillosa que eres,  
y recordarte que mereces todo lo bueno del mundo.</p>

<p>Sé que tuviste una experiencia difícil antes, y que el amor no fue justo contigo.  
Yo quisiera cambiar eso, estar a tu lado y darte un amor bonito y sincero,  
con todo lo que puedo ofrecerte.</p>

<p>Tal vez no siempre lo diga con palabras, porque me salen mejor por escrito,  
pero cada pensamiento, cada gesto y cada detalle que comparto contigo viene de mi corazoncito.  
Quiero que sepas que eres increíble y que mi cariño por ti es muy grande.</p>

<p>Y hoy, con todo esto en mi corazón, solo quiero preguntarte algo desde lo más profundo de mí…</p>

<h3 style="text-align:center; margin-top:25px;">
¿Quieres ser mi San Valentín? 💖
</h3>

<div style="text-align:center; margin-top:20px;">
<button onclick="respuestaSi()">💗 Sí</button>
<button onclick="respuestaNo()">😳 No</button>
</div>

</div>
`;

iniciarCuentaRegresiva();
}

// =============== FUNCIONES EXTRA ============
function toggleMusica(){
let m=document.getElementById("musica");
m.paused?m.play():m.pause();
}

let texto=document.getElementById("mensaje").value;
let s=document.getElementById("sobre");
s.style.display="block";
s.innerHTML="<h3>"+texto+"</h3>";
}

function cargarFotos(e){
let gal=document.getElementById("galeria");
for(let file of e.target.files){
 let img=document.createElement("img");
 img.src=URL.createObjectURL(file);
 gal.appendChild(img);
}
}

function generarPoema(){
document.getElementById("poema").innerText=
"Eres mi casualidad favorita,\nmi mejor destino inesperado,\ny el lugar donde siempre quiero volver.";
}

function iniciarCuentaRegresiva(){
let fecha=new Date("2026-02-14");
setInterval(()=>{
 let ahora=new Date();
 let diff=fecha-ahora;
 let dias=Math.floor(diff/(1000*60*60*24));
 document.getElementById("contador").innerText=dias+" días para nuestro día especial 💕";
},1000);
}

function iniciarCorazones(){
    setInterval(()=>{
        let heart=document.createElement("div");
        heart.classList.add("heart");

        heart.style.left=Math.random()*100+"vw";
        heart.style.animationDuration=(Math.random()*3+3)+"s";
        heart.style.opacity=Math.random();

        document.body.appendChild(heart);

        setTimeout(()=>{
            heart.remove();
        },6000);

    },1000);
}


function resetHeart(heart){

    heart.style.left = Math.random()*100 + "vw";

    // Mantiene velocidad elegante
    heart.style.animationDuration = (Math.random()*3+6)+"s";

    heart.style.top = "-60px";
    heart.style.animation = "none";
    heart.offsetHeight;
    heart.style.animation = null;

    // Tamaños más grandes y variados
    const tamaño = Math.random()*35 + 30; // entre 30px y 65px
    heart.style.width = tamaño + "px";
    heart.style.height = tamaño + "px";

    // Transparencia suave
    heart.style.opacity = Math.random()*0.4 + 0.5;

    // Ligera rotación elegante
    heart.style.transform = "rotate(" + (Math.random()*40 - 20) + "deg)";
}


function respuestaSi(){
contenido.innerHTML=`
<h2>❤️ Sabía que dirías que sí ❤️</h2>
<div class="caja">
<h3>Prometo hacer que cada día contigo sea especial.</h3>
<p>Gracias por elegirme. Gracias llegar a mi vida.  
Te quiero más de lo que las palabras pueden explicar ❤️.</p>
</div>
`;
}

function respuestaNo(){
alert("😅 Esa opción no estaba programada... vuelve a intentarlo 💕");
}

// =============== INICIO ====================
// if(diaActual==1) dia1();
// if(diaActual==2) dia2();

// ================= CONTROL MANUAL =================
let activarJuego = true; // true = empieza en Día 1, false = carta directa

if(activarJuego){
    dia1();
}else{
    mostrarExperiencia();
}

</script>
